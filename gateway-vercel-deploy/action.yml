name: "Gateway Vercel Deploy"
description: "Resolve vercel.json placeholders, sync Infisical secrets to Vercel, and deploy a Vercel edge gateway"

inputs:
  vercel_token:
    required: true
    description: "Vercel API token"

  vercel_org_id:
    required: true
    description: "Vercel org/team ID"

  vercel_project_id:
    required: true
    description: "Vercel project ID"

  target:
    required: true
    description: "Vercel environment target (preview | production)"

  vercel_json_path:
    required: false
    description: "Path to the vercel.json file to resolve placeholders in"
    default: "vercel.json"

  infisical_method:
    required: false
    description: "Infisical auth method (oidc, universal, aws-iam)"
    default: "oidc"

  infisical_identity_id:
    required: false
    description: "Infisical Machine Identity ID (for oidc/aws-iam)"

  infisical_client_id:
    required: false
    description: "Infisical Machine Identity client ID (for universal auth)"

  infisical_client_secret:
    required: false
    description: "Infisical Machine Identity client secret (for universal auth)"

  infisical_domain:
    required: false
    description: "Infisical instance URL"
    default: "https://app.infisical.com"

  infisical_project_slug:
    required: true
    description: "Infisical project slug"

  infisical_env_slug:
    required: true
    description: "Infisical environment slug (e.g. dev, staging, prod)"

  infisical_secret_path:
    required: false
    description: "Infisical secret path"
    default: "/"

runs:
  using: "composite"

  steps:
    - name: Fetch secrets from Infisical
      uses: Infisical/secrets-action@v1.0.16
      with:
        method: ${{ inputs.infisical_method }}
        identity-id: ${{ inputs.infisical_identity_id }}
        client-id: ${{ inputs.infisical_client_id }}
        client-secret: ${{ inputs.infisical_client_secret }}
        domain: ${{ inputs.infisical_domain }}
        project-slug: ${{ inputs.infisical_project_slug }}
        env-slug: ${{ inputs.infisical_env_slug }}
        secret-path: ${{ inputs.infisical_secret_path }}
        export-type: "file"
        file-output-path: "/.env.infisical"

    - name: Debug info
      shell: bash
      run: |
        echo "=== DEBUG: gateway-vercel-deploy ==="
        echo "Vercel Token (first 8 chars): ${{ inputs.vercel_token }}" | cut -c1-50
        echo "Vercel Org ID: ${{ inputs.vercel_org_id }}"
        echo "Vercel Project ID: ${{ inputs.vercel_project_id }}"
        echo "Target: ${{ inputs.target }}"
        echo "vercel_json_path: ${{ inputs.vercel_json_path }}"
        echo "Infisical project slug: ${{ inputs.infisical_project_slug }}"
        echo "Infisical env slug: ${{ inputs.infisical_env_slug }}"
        echo "Infisical secret path: ${{ inputs.infisical_secret_path }}"
        echo "====================================="

    - name: Resolve env vars in vercel.json
      shell: bash
      run: |
        # Source secrets and build a substitution list from the file's keys only
        ENV_FILE="${GITHUB_WORKSPACE}/.env.infisical"

        echo "=== DEBUG: Env file contents before resolve ==="
        cat "$ENV_FILE"
        echo ""
        echo "================================================"

        VARS=""
        while IFS='=' read -r key _; do
          [[ -z "$key" || "$key" =~ ^[[:space:]]*# ]] && continue
          VARS="${VARS}\${${key}} "
        done < "$ENV_FILE"

        echo "Substitution vars: $VARS"

        set -a
        source "$ENV_FILE"
        set +a

        echo "=== DEBUG: vercel.json BEFORE envsubst ==="
        cat ${{ inputs.vercel_json_path }}
        echo ""

        envsubst "$VARS" < ${{ inputs.vercel_json_path }} > vercel.resolved.json
        mv vercel.resolved.json ${{ inputs.vercel_json_path }}

        echo "=== DEBUG: vercel.json AFTER envsubst ==="
        cat ${{ inputs.vercel_json_path }}
        echo ""

    - name: Sync secrets to Vercel
      shell: bash
      run: |
        set -euo pipefail

        VERCEL_API="https://api.vercel.com/v10/projects"
        PROJECT_ID="${{ inputs.vercel_project_id }}"
        VERCEL_TOKEN="${{ inputs.vercel_token }}"
        TARGET="${{ inputs.target }}"
        TEAM_ID="${{ inputs.vercel_org_id }}"

        ENV_FILE="${GITHUB_WORKSPACE}/.env.infisical"

        # Debug: print all non-secret inputs
        echo "=== DEBUG: Sync secrets to Vercel ==="
        echo "Project ID: ${PROJECT_ID}"
        echo "Team ID: ${TEAM_ID:-<not set>}"
        echo "Target: ${TARGET}"
        echo "Token (first 8 chars): ${VERCEL_TOKEN:0:8}..."
        echo "Env file path: ${ENV_FILE}"
        echo "======================================"

        # Build query params
        QUERY="upsert=true"
        if [ -n "${TEAM_ID:-}" ]; then
          QUERY="${QUERY}&teamId=${TEAM_ID}"
        fi

        echo "Request URL pattern: ${VERCEL_API}/${PROJECT_ID}/env?${QUERY}"

        if [ ! -f "$ENV_FILE" ] || [ ! -s "$ENV_FILE" ]; then
          echo "::warning::No secrets found in Infisical at the specified path."
          exit 0
        fi

        COUNT=0
        FAILED=0

        while IFS= read -r line || [ -n "$line" ]; do
          # Skip empty lines and comments
          [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue

          # Parse KEY=VALUE
          KEY="${line%%=*}"
          VALUE="${line#*=}"

          # Strip surrounding quotes from value if present
          VALUE="${VALUE#\"}"
          VALUE="${VALUE%\"}"
          VALUE="${VALUE#\'}"
          VALUE="${VALUE%\'}"

          [[ -z "$KEY" ]] && continue

          COUNT=$((COUNT + 1))

          echo "--- Syncing: $KEY = $VALUE ---"

          REQUEST_BODY=$(jq -n \
            --arg key "$KEY" \
            --arg value "$VALUE" \
            --arg target "$TARGET" \
            '{key: $key, value: $value, type: "encrypted", target: [$target]}')
          echo "Request body: $REQUEST_BODY"
          echo "URL: ${VERCEL_API}/${PROJECT_ID}/env?${QUERY}"

          RESPONSE_FILE=$(mktemp)
          HTTP_CODE=$(curl -s -o "$RESPONSE_FILE" -w "%{http_code}" \
            -X POST "${VERCEL_API}/${PROJECT_ID}/env?${QUERY}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_BODY")

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            BODY=$(cat "$RESPONSE_FILE")
            echo "✔ Synced: $KEY (HTTP $HTTP_CODE) — Response: $BODY"
          else
            BODY=$(cat "$RESPONSE_FILE")
            echo "::error::✖ Failed to sync: $KEY (HTTP $HTTP_CODE) — Response: $BODY"
            FAILED=$((FAILED + 1))
          fi
          rm -f "$RESPONSE_FILE"
        done < "$ENV_FILE"

        # Clean up
        rm -f "$ENV_FILE"

        echo "Found $COUNT secret(s) to sync."

        if [ "$FAILED" -gt 0 ]; then
          echo "::error::$FAILED secret(s) failed to sync."
          exit 1
        fi

        echo "Environment sync complete."

    - name: Setup Node.js
      uses: actions/setup-node@v7.0.0
      with:
        node-version: "24"

    - name: Install Vercel CLI
      shell: bash
      run: npm install --global vercel@latest

    - name: Install dependencies
      shell: bash
      run: npm install

    - name: Pull Vercel project settings
      shell: bash
      env:
        VERCEL_ORG_ID: ${{ inputs.vercel_org_id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel_project_id }}
      run: |
        echo "=== DEBUG: Pulling Vercel settings ==="
        echo "VERCEL_ORG_ID: $VERCEL_ORG_ID"
        echo "VERCEL_PROJECT_ID: $VERCEL_PROJECT_ID"
        echo "Environment: ${{ inputs.target }}"
        echo "======================================="
        vercel pull --yes --environment=${{ inputs.target }} --token=${{ inputs.vercel_token }}

    - name: Build Vercel artifacts
      shell: bash
      env:
        VERCEL_ORG_ID: ${{ inputs.vercel_org_id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel_project_id }}
      run: |
        echo "=== DEBUG: Building Vercel artifacts ==="
        echo "Target: ${{ inputs.target }}"
        if [ "${{ inputs.target }}" = "production" ]; then
          echo "Running: vercel build --prod"
          vercel build --prod --token=${{ inputs.vercel_token }}
        else
          echo "Running: vercel build"
          vercel build --token=${{ inputs.vercel_token }}
        fi

    - name: Deploy to Vercel
      id: deploy
      shell: bash
      env:
        VERCEL_ORG_ID: ${{ inputs.vercel_org_id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel_project_id }}
      run: |
        echo "=== DEBUG: Deploying to Vercel ==="
        if [ "${{ inputs.target }}" = "production" ]; then
          echo "Running: vercel deploy --prebuilt --prod"
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ inputs.vercel_token }})
        else
          echo "Running: vercel deploy --prebuilt"
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --token=${{ inputs.vercel_token }})
        fi
        echo "Deployment URL: $DEPLOYMENT_URL"
        echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

    - name: Assign alias to preview deployment
      if: ${{ inputs.target != 'production' }}
      shell: bash
      env:
        VERCEL_TOKEN: ${{ inputs.vercel_token }}
        VERCEL_TEAM_ID: ${{ inputs.vercel_org_id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel_project_id }}
      run: |
        echo "=== DEBUG: Assigning alias ==="
        echo "Fetching domains for project: $VERCEL_PROJECT_ID (team: $VERCEL_TEAM_ID)"

        DOMAINS_RESPONSE=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
          "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/domains?teamId=$VERCEL_TEAM_ID")
        echo "Domains response: $DOMAINS_RESPONSE"

        PROD_DOMAIN=$(echo "$DOMAINS_RESPONSE" \
          | jq -r '[.domains[] | select(.gitBranch == null)] | .[0].name // empty')

        if [ -z "$PROD_DOMAIN" ]; then
          echo "::warning::Could not determine production domain — skipping alias assignment"
          exit 0
        fi

        ALIAS_DOMAIN="dev-${PROD_DOMAIN}"
        echo "Production domain: $PROD_DOMAIN"
        echo "Assigning alias: $ALIAS_DOMAIN"
        vercel alias set ${{ steps.deploy.outputs.deployment_url }} "$ALIAS_DOMAIN" --token=$VERCEL_TOKEN --scope=$VERCEL_TEAM_ID
