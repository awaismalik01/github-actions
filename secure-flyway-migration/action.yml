name: "Secure Flyway Migration"
description: "Run Flyway migrations with per-schema credentials fetched from Infisical"

inputs:
  infisical-method:
    description: "Infisical auth method (oidc, universal, aws-iam)"
    required: false
    default: "oidc"
  infisical-identity-id:
    description: "Infisical Machine Identity ID (for oidc/aws-iam auth)"
    required: false
  infisical-client-id:
    description: "Infisical Machine Identity client ID (for universal auth)"
    required: false
  infisical-client-secret:
    description: "Infisical Machine Identity client secret (for universal auth)"
    required: false
  infisical-domain:
    description: "Infisical instance URL"
    required: false
    default: "https://app.infisical.com"
  infisical-project-slug:
    description: "Infisical project slug"
    required: true
  infisical-env-slug:
    description: "Infisical environment slug (e.g. dev, staging, prod)"
    required: true
  infisical-secret-path:
    description: "Infisical secret path"
    required: false
    default: "/"
  migration-path:
    description: "Path to migration files"
    required: true
  schema:
    description: "Database schema for migrations and history table"
    required: false
    default: "public"

runs:
  using: "composite"
  steps:
    - name: Fetch secrets from Infisical
      uses: Infisical/secrets-action@v1.0.16
      with:
        method: ${{ inputs.infisical-method }}
        identity-id: ${{ inputs.infisical-identity-id }}
        client-id: ${{ inputs.infisical-client-id }}
        client-secret: ${{ inputs.infisical-client-secret }}
        domain: ${{ inputs.infisical-domain }}
        project-slug: ${{ inputs.infisical-project-slug }}
        env-slug: ${{ inputs.infisical-env-slug }}
        secret-path: ${{ inputs.infisical-secret-path }}

    - name: Resolve credentials and run migration
      run: |
        echo "=== DEBUG: Infisical Secrets Resolved ==="
        echo "FLYWAY_USER: ${FLYWAY_USER:-<not set>}"
        echo "FLYWAY_PASSWORD: ${FLYWAY_PASSWORD:-<not set>}"
        echo "DATABASE_URL: ${DATABASE_URL:-<not set>}"
        echo "=========================================="

        if [ -z "$FLYWAY_USER" ]; then
          echo "::error::Secret FLYWAY_USER not found in Infisical"
          exit 1
        fi
        if [ -z "$FLYWAY_PASSWORD" ]; then
          echo "::error::Secret FLYWAY_PASSWORD not found in Infisical"
          exit 1
        fi
        if [ -z "$DATABASE_URL" ]; then
          echo "::error::Secret DATABASE_URL not found in Infisical"
          exit 1
        fi
      shell: bash

    - name: Run Flyway migration
      uses: awaismalik01/github-actions/db-flyway@v1
      with:
        db-url: ${{ env.DATABASE_URL }}
        db-user: ${{ env.FLYWAY_USER }}
        db-password: ${{ env.FLYWAY_PASSWORD }}
        migration-path: ${{ inputs.migration-path }}
        schema: ${{ inputs.schema }}
